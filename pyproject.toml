[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "angvey-lam"
version = "0.1.0"
description = "Turn any LLM API (Groq, OpenAI, etc.) into a controlled, powerful Language Agent with smart web gatherer and permissioned tools."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "angvey int"}]
keywords = ["agent", "llm", "groq", "crawl", "gatherer", "tools", "permissions"]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.0",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "html2text>=2024.2",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
browser = ["playwright>=1.40"]
dev = ["pytest>=8.0", "ruff>=0.4"]

[project.scripts]
angvey-lam = "angvey_lam.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
